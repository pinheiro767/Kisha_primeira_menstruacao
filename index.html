*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#54264c,#a64986,#f6a8cf);font-family:system-ui,Arial;color:#442344;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}#shell{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9;max-height:100dvh;box-shadow:0 20px 80px #351b4577;overflow:hidden;border-radius:12px;background:#f4c0d5}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:2%;left:2%;right:2%;display:none;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;color:#6d295b;font-weight:900;text-shadow:0 1px #fff}.pill{background:#fffdeede;padding:8px 14px;border:2px solid #fff;border-radius:22px;box-shadow:0 3px 8px #5b264944}#pause{pointer-events:auto;cursor:pointer;border:0;background:#f86db1;color:white;border-radius:18px;font-size:22px;padding:5px 13px}#controls{display:none;position:absolute;bottom:3%;left:3%;right:3%;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:14px}.ctrl{pointer-events:auto;touch-action:none;user-select:none;background:#f97cbecc;border:3px solid white;color:white;border-radius:22px;min-width:68px;min-height:66px;font-size:28px;font-weight:900;box-shadow:0 5px 0 #a74b88}#overlay{position:absolute;inset:0;background:linear-gradient(120deg,#fff1f2f0,#fbd9f4e9);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#panel{max-width:670px;width:100%;text-align:center;background:#ffffffed;border:3px solid #fff;border-radius:30px;padding:clamp(12px,2.3vw,24px);box-shadow:0 12px 50px #8a477b44;max-height:96%;overflow:auto}h1{font-size:clamp(23px,4vw,42px);color:#bb367f;margin:4px 0 8px}h2{font-size:clamp(21px,3vw,31px);color:#b33a82;margin:4px 0 12px}p{font-size:clamp(13px,1.8vw,18px);line-height:1.45;margin:8px 0 15px}.hero{height:clamp(85px,22vh,170px);max-width:100%;object-fit:contain;display:block;margin:auto}.btn{background:linear-gradient(#ff8ac1,#e750a0);border:3px solid white;color:white;border-radius:20px;font-size:clamp(15px,2vw,20px);font-weight:900;padding:12px 22px;cursor:pointer;margin:5px;box-shadow:0 4px 0 #a93c80}.btn.alt{background:linear-gradient(#9d8af0,#765ac8)}.small{font-size:13px;color:#775875}#sound{position:absolute;bottom:1%;right:1%;font-size:12px;background:#fff9;border:0;border-radius:12px;padding:6px;cursor:pointer;z-index:3}@media(pointer:coarse){#controls{display:flex}}@media(max-height:420px){#panel{padding:9px}p{margin:3px 0 7px}.hero{height:75px}.btn{padding:7px 15px}}
</style></head><body><div id="shell"><canvas id="game" width="960" height="540" aria-label="Jogo de plataforma da Kisha"></canvas><div id="hud"><span class="pill" id="levelText">🌸 Fase 1</span><span class="pill" id="heartText">❤️❤️❤️</span><span class="pill" id="countText">⭐ 0/5</span><span class="pill" id="scoreText">🪙 0 pts</span><button id="pause" aria-label="Pausar jogo">Ⅱ</button></div><div id="controls"><div class="cluster"><button class="ctrl" data-key="left" aria-label="Mover para esquerda">◀</button><button class="ctrl" data-key="right" aria-label="Mover para direita">▶</button></div><div class="cluster"><button class="ctrl" data-key="jump" aria-label="Pular">⬆ PULAR</button></div></div><button id="sound" aria-label="Ativar ou desativar som">🔊 Som</button><audio id="bgMusic" src="assets/musica-jogo.mp3" preload="auto" loop></audio><div id="overlay"><div id="panel"></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),controls=document.getElementById('controls');const W=960,H=540;
const files={idle:'personagem/idle_new.png',jump:'personagem/jump_2.png',win:'personagem/win_new.png',collect:'personagem/collect_1.png',run:Array.from({length:7},(_,i)=>`personagem/run_${i+1}.png`),drop:'colecionaveis/gotinha_1.png',pad:'colecionaveis/absorvente_1.png',health:'objetos/saude_cruz.png',heart:'interface/coracao_1.png',portal:'objetos/portal.png',pack:'objetos/pacote.png',star:'objetos/estrela_grande.png',sign:'interface/placa_madeira.png'};const images={};function load(k,p){let im=new Image();im.src='assets/'+p;images[k]=im}Object.entries(files).forEach(([k,v])=>Array.isArray(v)?v.forEach((p,i)=>load('run'+i,p)):load(k,v));[1,2,3].forEach(i=>load('bg'+i,`fase${i}.jpg`));function draw(k,x,y,w,h,flip=false){let im=images[k];if(!im||!im.complete||!im.naturalWidth)return;ctx.save();if(flip){ctx.translate(x+w,0);ctx.scale(-1,1);x=0}ctx.drawImage(im,x,y,w,h);ctx.restore()}
let audio=null,sound=true;const bgMusic=document.getElementById("bgMusic");bgMusic.volume=.23;function syncMusic(){if(sound&&mode==="play"){bgMusic.play().catch(()=>{})}else{bgMusic.pause()}}function initAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function tone(f,d=.12,type='sine',vol=.07){if(!sound||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function jingle(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.24,'triangle'),i*115))}
const texts=[['A menstruação é um processo natural do corpo.','O fluxo menstrual contém sangue e tecido do revestimento do útero.','A duração e a quantidade do fluxo variam entre as pessoas.','Cólicas e cansaço podem acontecer durante a menstruação.','Descanso, hidratação e atenção ao corpo são importantes.'],['O absorvente deve ser trocado regularmente, conforme o fluxo e o conforto.','Lave as mãos antes e depois de trocar o absorvente.','Descarte absorventes usados embrulhados no lixo, nunca no vaso sanitário.','Escolha produtos confortáveis e observe se há irritação.','Higiene e acesso a produtos menstruais fazem parte do autocuidado.'],['Conhecer seu corpo ajuda a perceber mudanças.','Procure profissionais de saúde quando precisar de orientação.','A higiene da região externa deve ser suave; evite produtos irritantes.','Dor intensa ou sangramento incomum merecem avaliação profissional.','Informação e cuidado ajudam a proteger a saúde.']];const quiz=[
[['O fluxo menstrual sai do corpo pela...', 'Vagina','Bexiga',0],['A menstruação é...', 'Uma doença','Um processo natural',1],['O fluxo menstrual pode variar?', 'Sim','Não',0],['Cólicas podem ocorrer durante a menstruação?', 'Sim','Nunca',0],['Beber água e descansar podem ajudar no autocuidado?', 'Sim','Não',0]],
[['Quando trocar o absorvente?', 'Regularmente, conforme o fluxo','Somente uma vez ao dia',0],['Antes e depois da troca, devemos...', 'Lavar as mãos','Evitar lavar as mãos',0],['Onde descartar o absorvente usado?', 'No vaso sanitário','No lixo, bem embrulhado',1],['Se um produto causar irritação...', 'É importante observar e buscar orientação','É obrigatório continuar usando',0],['O absorvente deve ser...', 'Compartilhado após o uso','De uso individual',1]],
[['Conhecer o próprio corpo ajuda a...', 'Perceber mudanças','Ignorar sintomas',0],['Se houver dor muito intensa...', 'Buscar avaliação de saúde','Ignorar sempre',0],['Na higiene íntima externa, prefira...', 'Produtos irritantes e perfumes fortes','Cuidados suaves',1],['Se houver sangramento inesperado persistente...', 'Buscar orientação profissional','Nunca contar a ninguém',0],['Quando houver dúvidas sobre saúde...', 'Conversar com profissional de saúde','Acreditar em qualquer boato',0]]
];const names=['Menstruação','Absorvente','Clínica e Saúde'];let level=0,mode='menu',hearts=3,collected=0,px=55,py=0,vx=0,vy=0,camera=0,face=1,t=0,inv=0,items=[],readSigns=new Set(),keys={left:false,right:false,jump:false},jumpLock=false,score=0,coins=[],quizAnswered=new Set(),currentQuiz=-1;const world=3200,ground=444;const platforms=[{x:0,y:ground,w:world,h:120},...Array.from({length:12},(_,i)=>({x:245+i*235,y:330-(i%3)*42,w:138,h:18}))];const hazards=[700,1380,2090,2720];function resetStage(n){level=n;px=65;py=ground-104;vx=vy=0;camera=0;hearts=3;collected=0;inv=0;readSigns=new Set();quizAnswered=new Set();coins=Array.from({length:23},(_,i)=>({x:175+i*125,y:ground-80-(i%4===1?95:0),got:false}));items=[390,920,1480,2140,2770].map((x,i)=>({x,y:ground-85-(i%2)*52,got:false}));hud.style.display='flex';document.getElementById('levelText').textContent=`🌸 Fase ${n+1}: ${names[n]}`;updateHUD()};function updateHUD(){document.getElementById('heartText').textContent='❤️'.repeat(hearts)+'🖤'.repeat(3-hearts);document.getElementById('countText').textContent=`✨ ${collected}/5`;document.getElementById('scoreText').textContent=`🪙 ${score} pts`};function screen(html){overlay.style.display='flex';panel.innerHTML=html;mode='overlay';controls.style.display='none';syncMusic()}function start(){initAudio();score=0;resetStage(0);overlay.style.display='none';mode='play';controls.style.display='';syncMusic();tone(659)}function resume(){overlay.style.display='none';mode='play';controls.style.display='';initAudio();syncMusic()}function showMenu(){hud.style.display='none';screen(`<h1>Kisha — Jornada do Cuidado</h1><img class="hero" src="assets/personagem/idle_new.png" alt="Kisha sorrindo"><p>Explore três mundos mágicos, colecione moedas, responda perguntas com duas alternativas, encontre cinco objetos em cada fase e descubra como cuidar do corpo!</p><button class="btn" onclick="start()">▶ JOGAR</button><button class="btn alt" onclick="help()">COMO JOGAR</button><p class="small">Teclado: ← → ou A/D para andar, ↑ / W / Espaço para pular. No celular, use os botões da tela.</p>`)}function help(){screen(`<h2>Como jogar</h2><p>Agora a Kisha pula mais alto! Pressione PULAR uma vez a cada salto. Corra e pule pelas plataformas. Colete os cinco itens brilhantes de cada mundo. Aproxime-se das plaquinhas para aprender. Evite os obstáculos: você tem três corações e um período de proteção após cada colisão. Depois das cinco coletas, o portal será liberado automaticamente para você avançar, sem precisar atravessar obstáculos adicionais!</p><button class="btn" onclick="${level===0&&collected===0?'start()':'resume()'}">ENTENDI!</button>`)}function pause(){if(mode==='play')screen(`<h2>⏸ Jogo pausado</h2><button class="btn" onclick="resume()">CONTINUAR</button><button class="btn alt" onclick="showMenu()">INÍCIO</button>`)}function educate(i){readSigns.add(i);currentQuiz=i;tone(580,.13);const q=quiz[level][i];screen(`<h2>🌸 Você sabia?</h2><p>${texts[level][i]}</p><h2 style="font-size:clamp(16px,2.5vw,24px)">${q[0]}</h2><button class="btn alt" onclick="answer(0)">A) ${q[1]}</button><button class="btn alt" onclick="answer(1)">B) ${q[2]}</button><p class="small">Acertar vale 50 pontos!</p>`)}
function answer(choice){const q=quiz[level][currentQuiz];if(choice===q[3]){if(!quizAnswered.has(currentQuiz)){score+=50;quizAnswered.add(currentQuiz)}updateHUD();jingle();screen(`<h2>✅ Resposta correta!</h2><p>+50 pontos! Continue a aventura.</p><button class="btn" onclick="resume()">CONTINUAR ▶</button>`)}else{tone(230,.23,'triangle');screen(`<h2>🌷 Vamos tentar outra vez?</h2><p>${q[0]}</p><button class="btn alt" onclick="answer(0)">A) ${q[1]}</button><button class="btn alt" onclick="answer(1)">B) ${q[2]}</button>`)}}function hit(){if(inv>0)return;hearts--;inv=145;tone(180,.3,'sawtooth',.05);updateHUD();if(hearts<=0){screen(`<h2>💗 Vamos tentar novamente?</h2><p>Kisha pode recomeçar esta fase e continuar aprendendo!</p><button class="btn" onclick="retry()">TENTAR NOVAMENTE</button>`)}else{px=Math.max(45,px-175);py=ground-110;vy=-12}}function retry(){resetStage(level);resume()}function finish(){jingle();if(level<2){let extra=level===1?'<img class="hero" src="assets/objetos/pacote.png" alt="Pacote completo">':'<img class="hero" src="assets/personagem/win_new.png" alt="Kisha comemorando">';screen(`<h2>🎉 FASE ${level+1} COMPLETA!</h2>${extra}<p>🌸 Portal liberado! ${level===1?'Pacote completo! Você aprendeu sobre higiene menstrual.':'Muito bem! Você encontrou os cinco itens e aprendeu algo novo.'}</p><button class="btn" onclick="next()">PRÓXIMA FASE ➜</button>`)}else{screen(`<h1>🎉 PARABÉNS!</h1><img class="hero" src="assets/personagem/win_new.png" alt="Kisha comemorando"><p><strong>Você completou a Jornada do Cuidado!</strong></p><h2>🪙 Pontuação total: ${score} pontos</h2><p>Conhecer o seu corpo é um ato de cuidado. Você se cuida, você brilha!</p><button class="btn" onclick="start()">JOGAR NOVAMENTE</button><button class="btn alt" onclick="showMenu()">VOLTAR AO INÍCIO</button>`)}}function next(){resetStage(level+1);resume()}
function physics(dt){let speed=5.3;vx=(Number(keys.right)-Number(keys.left))*speed;if(vx)face=vx>0?1:-1;let oldY=py;let grounded=py+104>=ground-.5||platforms.slice(1).some(p=>Math.abs(py+104-p.y)<3&&px+56>p.x&&px+15<p.x+p.w);if(keys.jump&&!jumpLock&&grounded){vy=-19.5;jumpLock=true;tone(470,.09)}if(!keys.jump)jumpLock=false;vy=Math.min(15,vy+.56*dt);px=Math.max(0,Math.min(world-85,px+vx*dt));py+=vy*dt;if(py+104>=ground){py=ground-104;vy=0}for(let p of platforms.slice(1)){if(px+56>p.x&&px+15<p.x+p.w&&oldY+104<=p.y+8&&py+104>=p.y&&vy>=0){py=p.y-104;vy=0}}if(py>H+50){hit();py=ground-104}if(inv>0)inv-=dt;for(let i=0;i<items.length;i++){let it=items[i];if(!it.got&&Math.abs(px+36-it.x)<62&&Math.abs(py+55-it.y)<75){it.got=true;collected++;tone(720+i*90,.17,'triangle');updateHUD();if(collected===5){finish();return}}}for(let coin of coins){if(!coin.got&&Math.abs(px+35-coin.x)<48&&Math.abs(py+55-coin.y)<66){coin.got=true;score+=10;tone(950,.10,'triangle');updateHUD()}}for(let i=0;i<5;i++){let x=520+i*555;if(!readSigns.has(i)&&Math.abs(px+40-x)<58) {educate(i);break}}for(let x of hazards){if(Math.abs(px+35-x)<38&&py+104>ground-42)hit()}if(px>world-185&&collected===5)finish();camera=Math.max(0,Math.min(world-W,px-280))}
function render(){ctx.clearRect(0,0,W,H);let bg=images['bg'+(level+1)];if(bg?.complete&&bg.naturalWidth){let shift=(camera/world)*290;ctx.drawImage(bg,-shift,0,W+300,H)}else{ctx.fillStyle='#f8b4d4';ctx.fillRect(0,0,W,H)}ctx.save();ctx.translate(-camera,0);ctx.fillStyle='#f7b7d5aa';ctx.fillRect(0,ground,world,H-ground);ctx.fillStyle='#eaa0c9';ctx.fillRect(0,ground,world,8);for(let p of platforms.slice(1)){ctx.fillStyle='#ffffffbb';ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,10);ctx.fill();ctx.fillStyle='#d87eb4';ctx.fillRect(p.x,p.y+14,p.w,5)}for(let x of hazards){ctx.fillStyle='#a66ad0';ctx.beginPath();ctx.moveTo(x-24,ground);ctx.lineTo(x,ground-47);ctx.lineTo(x+24,ground);ctx.fill()}for(let coin of coins){if(!coin.got){let yy=coin.y+Math.sin(t/11+coin.x)*6;ctx.fillStyle='#ffcf39';ctx.strokeStyle='#fff0a0';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(coin.x,yy,17,19,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#a96a08';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('★',coin.x,yy+7)}}for(let i=0;i<5;i++){let x=520+i*555;draw('sign',x-38,ground-104,80,68);ctx.fillStyle='#633457';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('?',x,ground-60)}items.forEach((it,i)=>{if(!it.got){let k=['drop','pad','health'][level];draw(k,it.x-27,it.y-27+Math.sin(t/15+i)*7,56,58)}});draw('portal',world-175,ground-170,150,172);if(collected<5){ctx.font='bold 16px system-ui';ctx.fillStyle='#713b69';ctx.textAlign='center';ctx.fillText('Colete 5 itens',world-100,ground-180)}let k=Math.abs(vx)>0?'run'+Math.floor(t/6)%7:vy!==0?'jump':'idle';if(vy!==0)k='jump';if(inv<=0||Math.floor(t/4)%2===0)draw(k,px-20,py-12,105,116,face<0);ctx.restore();ctx.fillStyle='#ffffff44';for(let i=0;i<12;i++){let x=(i*179+t*.35)%W,y=45+(i*97)%350;ctx.beginPath();ctx.arc(x,y,2.3+Math.sin(t*.04+i),0,Math.PI*2);ctx.fill()}}
let last=performance.now();function loop(now){let dt=Math.min(2,(now-last)/16.67);last=now;t+=dt;if(mode==='play')physics(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function key(k,on){if(['ArrowLeft','a','A'].includes(k))keys.left=on;if(['ArrowRight','d','D'].includes(k))keys.right=on;if(['ArrowUp','w','W',' '].includes(k))keys.jump=on}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();key(e.key,true);if(e.key==='Escape')pause()});document.addEventListener('keyup',e=>key(e.key,false));document.querySelectorAll('.ctrl').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.getElementById('pause').onclick=pause;document.getElementById('sound').onclick=()=>{sound=!sound;syncMusic();document.getElementById('sound').textContent=sound?'🔊 Som':'🔇 Mudo';if(sound)initAudio()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});showMenu();if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
